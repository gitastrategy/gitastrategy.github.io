name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # User/organization page (gitastrategy.github.io) or custom domain -> "/".
  # For a project subpath, use: /<repository-name>/
  BASE_PATH: "/"
  SITE_URL: "https://gitastrategy.in"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build static site
        run: bun run build
        env:
          STATIC_EXPORT: "1"
          BASE_PATH: ${{ env.BASE_PATH }}
      - name: Generate sitemap.xml and robots.txt
        run: node scripts/generate-static-seo.mjs
        env:
          BASE_PATH: ${{ env.BASE_PATH }}
          SITE_URL: ${{ env.SITE_URL }}
      - name: Static 404 page + disable Jekyll
        run: |
          if [ -f dist/client/404/index.html ]; then
            cp dist/client/404/index.html dist/client/404.html
          else
            cp dist/client/index.html dist/client/404.html
          fi
          touch dist/client/.nojekyll
      - name: Verify build output is the app, not the README
        run: |
          set -e
          test -f dist/client/index.html
          grep -qi "Gita Strategy" dist/client/index.html
          if grep -qi "Quick start\|bun install" dist/client/index.html; then
            echo "::error::Build output looks like rendered README content"; exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Smoke test the live site
        env:
          PAGE_URL: ${{ needs.deploy.outputs.page_url || 'https://gitastrategy.github.io/' }}
        run: |
          set -e
          BASE="${PAGE_URL%/}"
          echo "Testing $BASE"
          # Give the CDN a moment to serve the new deployment.
          sleep 20
          fail=0
          for path in "/" "/verses" "/articles" "/krishna" "/feedback" "/newsletter" "/unsubscribe"; do
            url="$BASE$path"
            code=$(curl -s -o /tmp/body.html -w "%{http_code}" -L "$url")
            if [ "$code" != "200" ]; then
              echo "::error::$url returned HTTP $code"; fail=1; continue
            fi
            if ! grep -qi "<div id=\"root\"\|Gita Strategy" /tmp/body.html; then
              echo "::error::$url did not return the app shell"; fail=1
            fi
            # Jekyll/README fallback detection.
            if grep -qi "Quick start" /tmp/body.html && grep -qi "bun install" /tmp/body.html; then
              echo "::error::$url is serving README/Jekyll content instead of the app"; fail=1
            fi
          done
          for asset in "/sitemap.xml" "/robots.txt"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L "$BASE$asset")
            [ "$code" = "200" ] || { echo "::error::$asset returned HTTP $code"; fail=1; }
          done
          exit $fail
